name: Atualizar preços

on:
  # schedule:                # pausado: o ML bloqueia leitura de página sem credencial
  #   - cron: "17 * * * *"
  workflow_dispatch: {}     # permite rodar na mão pelo app do GitHub

permissions:
  contents: write

concurrency:
  group: precos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar preços no Mercado Livre
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: python scripts/update_prices.py
      - name: Salvar preços novos
        if: always()
        run: |
          git config user.name "prendz-bot"
          git config user.email "prendz-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Atualiza preços" && git push)
